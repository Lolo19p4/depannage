<style>
:root{--bg:#fff;--fg:#111;--card:#f3f4f6;--acc:#d97706}

*{box-sizing:border-box}body{margin:0;font:22px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:12px;padding:14px;background:#111827;color:#fff}header img{width:56px;border-radius:12px}h1{font-size:26px;margin:0}

.g{background:var(--card);color:var(--fg)}
